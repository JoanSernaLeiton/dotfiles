# kitty config — only the overrides. Full reference: `kitty +runpy 'from kitty.config import *; print(commented_out_default_config())'`

# ── Fonts ────────────────────────────────────────────────────────────
font_family      FiraCode Nerd Font Mono
bold_font        FiraCode Nerd Font Mono:style=Bold
italic_font      FiraCode Nerd Font Mono
bold_italic_font FiraCode Nerd Font Mono:style=Bold
font_size 14.0
disable_ligatures cursor
modify_font cell_height 110%

# ── Window ───────────────────────────────────────────────────────────
inactive_text_alpha 0.8
background_opacity 0.95
enabled_layouts splits:split_axis=horizontal

# ── Tabs ─────────────────────────────────────────────────────────────
tab_title_template "{cwd_basename}"
active_tab_title_template "{fmt.fg._fff}{title}"
active_tab_background #8631B4

# ── Performance ──────────────────────────────────────────────────────
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ── Remote control ───────────────────────────────────────────────────
allow_remote_control yes
listen_on unix:/tmp/kitty

# ── Keymaps ──────────────────────────────────────────────────────────
map cmd+enter new_window_with_cwd
map ctrl+t launch --cwd=current --type=tab

# Splits
map f1 goto_layout splits
map f4 launch --location=split --cwd=current
map f5 launch --location=hsplit --cwd=current
map f6 launch --location=vsplit --cwd=current
map f7 layout_action rotate
map ctrl+. layout_action bias 80

# Move / focus windows
map shift+up    move_window up
map shift+left  move_window left
map shift+right move_window right
map shift+down  move_window down
map ctrl+shift+up    layout_action move_to_screen_edge top
map ctrl+shift+left  layout_action move_to_screen_edge left
map ctrl+shift+right layout_action move_to_screen_edge right
map ctrl+shift+down  layout_action move_to_screen_edge bottom
map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down

# Word jumps with alt+arrows (like other macOS terminals)
map alt+left  send_text all \x1b\x62
map alt+right send_text all \x1b\x66

include ./theme.conf
