# no command delay
set -sg escape-time 10

#set -g status-position top
set -g base-index 1
set -g pane-base-index 2
set -g renumber-windows on
bind-key -n C-t new-window
bind-key -n C-T new-window -c "#{pane_current_path}"

#bind k kill-pane
bind K kill-window

# toggle zoom
# Depending on the terminal, any rule applies. Such a mess.
# bind-key -n C-@ resize-pane -Z
# bind-key -n 'C-\\' resize-pane -Z
# bind-key -n 'C-\' "resize-pane -Z"
bind-key -n 'C-_' resize-pane -Z
# bind-key -n 'C-z' resize-pane -Z

# Don't rename windows automatically
set-option -g allow-rename off

# upgrade $TERM
# This requires to tic the tmux.terminfo file
# set -g default-terminal "xterm-256color"
# set-option -sa terminal-overrides ",xterm*:Tc"
# Use tmux-256color as default (works everywhere)
set -g default-terminal "tmux-256color"
# Enable true color for terminals that support it
set-option -sa terminal-overrides ",xterm*:Tc,alacritty:Tc,xterm-kitty:Tc"

# super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# increase scrollback buffer size
set -g history-limit 50000

# change leader to ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# resize of panes
bind-key -n C-S-Up resize-pane -U 10
bind-key -n C-S-Down resize-pane -D 10
bind-key -n C-S-Left resize-pane -L 10
bind-key -n C-S-Right resize-pane -R 10

# split
bind | split-window -h
bind \\ split-window -h -c '#{pane_current_path}'
bind _ split-window
bind - split-window -c '#{pane_current_path}'
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind , previous-window
bind . next-window

# navigation

# source .tmux.conf as suggested in `man tmux`
# bind R is defined below with display message

# switch panes using Alt-arrow without prefix
#bind -n M-Left select-pane -L
#bind -n M-Right select-pane -R
#bind -n M-Up select-pane -U
#bind -n M-Down select-pane -D
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# refresh 'status-left' and 'status-right' more often
set-option -g status-interval 1

# enable mouse
set -g mouse on

# recover focus events
set -g focus-events on

# Reload config
bind R source-file ~/.tmux.conf \; display "Config reloaded"

############################################################################
# Status Bar
############################################################################

set -g status-bg "colour237"
# set -g message-command-fg "colour235"
set -g status-justify "left"
set -g status-left-length "100"
set -g status "on"
# set -g pane-active-border-fg "colour208"
# set -g message-bg "colour243"
set -g status-right-length "100"
# set -g status-right-attr "none"
# set -g message-fg "colour235"
# set -g message-command-bg "colour243"
# set -g status-attr "none"
# set -g pane-border-fg "colour243"
# set -g status-left-attr "none"
# setw -g window-status-fg "colour246"
# setw -g window-status-attr "none"
# setw -g window-status-activity-bg "colour237"
# setw -g window-status-activity-attr "none"
# setw -g window-status-activity-fg "colour208"
setw -g window-status-separator ""
# setw -g window-status-bg "colour237"
set -g status-left "#[fg=colour235,bg=colour208] ● #[fg=colour208,bg=colour237]"

set -g status-right "#{E:@claude_status}#[fg=colour208,bg=colour243,nobold,nounderscore,noitalics]#[fg=colour235,bg=colour208] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD) "

setw -g window-status-format "#[fg=colour246,bg=colour237] #I |#[fg=colour246,bg=colour237] #W#{P:#{E:@claude_icon}} "
setw -g window-status-current-format "#[fg=colour237,bg=colour243,nobold,nounderscore,noitalics]#[fg=colour235,bg=colour243] #I |#[fg=colour235,bg=colour243] #W#{P:#{E:@claude_icon}}#[fg=colour235] #[fg=colour243,bg=colour237,nobold,nounderscore,noitalics]"

set-option -g visual-activity on

# use folder name as window's name
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Use vim keybindings in copy mode
setw -g mode-keys vi

bind-key -T copy-mode-vi 'v'   send -X begin-selection
bind-key -T copy-mode-vi 'V'   send -X select-line
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y'   send -X copy-pipe-and-cancel "$HOME/.local/bin/clipcopy"
bind-key -T copy-mode-vi 'Y'   send -X copy-end-of-line \; run "tmux save-buffer - | $HOME/.local/bin/clipcopy"

# Mouse drag → copy to clipboard on release
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$HOME/.local/bin/clipcopy"

# Paste: prefix+p from system clipboard, prefix+C-p from tmux buffer
bind p run "$HOME/.local/bin/clippaste | tmux load-buffer - && tmux paste-buffer"
bind C-p paste-buffer

set -g default-shell ${SHELL}

# List sessions directly (prefix + s)
bind s choose-tree -s
# Rename session (prefix + r)
bind r command-prompt -I '#S' 'rename-session %%'

# Command Palette (prefix + Space)
unbind Space
bind Space display-menu -T " Command Palette " \
  "List Sessions"              s "choose-tree -s" \
  "Rename Session"             r "command-prompt -I '#S' 'rename-session %%'" \
  "Kill Session"               x "confirm-before -p 'Kill session #S? (y/n)' 'kill-session'" \
  "New Session"                n "command-prompt 'new-session -s %%'" \
  "Detach"                     D "detach-client" \
  "" \
  "Split Horizontal"           1 "split-window -h -c '#{pane_current_path}'" \
  "Split Vertical"             2 "split-window -v -c '#{pane_current_path}'" \
  "Toggle Zoom"                z "resize-pane -Z" \
  "Resize Left"                3 "resize-pane -L 10" \
  "Resize Right"               4 "resize-pane -R 10" \
  "Resize Up"                  5 "resize-pane -U 5" \
  "Resize Down"                6 "resize-pane -D 5" \
  "Kill Pane"                  K "kill-pane" \
  "" \
  "Claude: Open Project"       f "display-popup -E -w 80% -h 70% \"$HOME/.local/bin/claude-tmux project '#{client_name}'\"" \
  "Claude: New Window"         C "run -b \"cd '#{pane_current_path}' && $HOME/.local/bin/claude-tmux new\"" \
  "Claude: New Worktree"       W "command-prompt -p 'Worktree name:' \"run -b \\\"cd '#{pane_current_path}' && $HOME/.local/bin/claude-tmux new -w '%%'\\\"\"" \
  "Claude: Jump To Waiting"    a "run -b '$HOME/.local/bin/claude-tmux next'" \
  "Claude: Dashboard"          A "display-popup -E -w 90% -h 80% \"$HOME/.local/bin/claude-tmux dashboard '#{client_name}'\"" \
  "Claude: Send Output"        E "run -b \"$HOME/.local/bin/claude-tmux send '#{pane_id}'\"" \
  "Claude: Scratch Popup"      ? "display-popup -E -w 85% -h 85% -d '#{pane_current_path}' '$HOME/.local/bin/claude-tmux scratch'" \
  "Claude: Team → Own Window"  T "run -b \"$HOME/.local/bin/claude-tmux team '#{pane_id}'\"" \
  "Claude: Notifications On/Off" N "run -b '$HOME/.local/bin/claude-tmux dnd'" \
  "Layout: Tiled"              t "select-layout tiled" \
  "Layout: Lead + Stack"       v "select-layout main-vertical" \
  "Sync Panes Toggle"          S "setw synchronize-panes" \
  "List All Keys"              k "list-keys -N"

############################################################################
# Claude Code
############################################################################
# bin/claude-tmux (wired as a Claude Code hook by `./install.sh claude`) sets the pane
# option @claude to working / waiting / done. Each Claude pane shows an icon in the
# window list:  ● needs you   ✓ finished   … working
set -g @claude_icon "#{?#{==:#{@claude},waiting}, #[fg=colour203#,bold]●#[nobold],}#{?#{==:#{@claude},done}, #[fg=colour114]✓,}#{?#{==:#{@claude},working}, #[fg=colour250]…,}"

# Label panes when a window is split (agent teams get one pane per teammate).
# Claude sets the pane title to what it's working on.
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-format " #{pane_index}#{E:@claude_icon}#[default] #{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}}#{?#{==:#{@claude},waiting}, #[fg=colour203]→ #{=/70/…:@claude_msg}#[default],}#{?#{@claude_ctx}, #[fg=colour244](#{@claude_ctx})#[default],} "
# Single-pane windows have no border, so the Claude pane's state also goes in the status bar (see @claude_status)

# Seeing a finished pane counts as reading it: clear ✓ on focus
set-hook -g pane-focus-in 'if -F "#{==:#{@claude},done}" "set -p -u @claude"'
set-hook -g session-window-changed 'if -F "#{==:#{@claude},done}" "set -p -u @claude"'

# Status bar (right): one ● per Claude waiting for you and ✓ per finished one, across ALL sessions,
# plus 🔕 when notifications are muted
set -g @claude_status "#{?@claude_dnd,#[fg=colour246]🔕 ,}#[fg=colour203#,bold]#{S:#{W:#{P:#{?#{==:#{@claude},waiting},●,}}}}#[fg=colour114#,nobold]#{S:#{W:#{P:#{?#{==:#{@claude},done},✓,}}}} "

# prefix + f: fuzzy-pick a project → its own session (windows: claude, nvim)
bind f display-popup -E -w 80% -h 70% "$HOME/.local/bin/claude-tmux project '#{client_name}'"
# prefix + C: new window running Claude here · prefix + W: same, in a new git worktree
bind C run -b "cd '#{pane_current_path}' && $HOME/.local/bin/claude-tmux new"
bind W command-prompt -p "Worktree name:" "run -b \"cd '#{pane_current_path}' && $HOME/.local/bin/claude-tmux new -w '%%'\""
# prefix + a: jump to the Claude pane that needs you (then finished ones)
bind a run -b "$HOME/.local/bin/claude-tmux next"
# prefix + A: dashboard of every Claude pane (state, age, last message, live preview)
bind A display-popup -E -w 90% -h 80% "$HOME/.local/bin/claude-tmux dashboard '#{client_name}'"
# prefix + E: paste the last 60 lines of this pane (failing test, stack trace…) into the nearest Claude prompt
bind E run -b "$HOME/.local/bin/claude-tmux send '#{pane_id}'"
# prefix + ?: persistent scratch Claude in a popup; the same key inside it hides it again
bind ? if -F "#{==:#{session_name},scratch}" "detach-client" "display-popup -E -w 85% -h 85% -d '#{pane_current_path}' '$HOME/.local/bin/claude-tmux scratch'"
# prefix + T: move agent teammates out of the lead's window into their own one
bind T run -b "$HOME/.local/bin/claude-tmux team '#{pane_id}'"
# prefix + N: mute/unmute desktop notifications
bind N run -b "$HOME/.local/bin/claude-tmux dnd"
# Layouts for agent teams
bind M-t select-layout tiled
bind M-v select-layout main-vertical
setw -g main-pane-width 50%

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect/continuum: save every 10 min, restore when tmux starts. Claude panes come back on
# the same conversation (claude-tmux resume), nvim reopens too.
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'
set -g @resurrect-processes '"~claude->claude-tmux resume" nvim'

# tmux-thumbs: press prefix+t, then the hint letter to copy (prefix+T to paste too)
set -g @thumbs-key 't'
set -g @thumbs-command 'echo -n {} | $HOME/.local/bin/clipcopy'
set -g @thumbs-upcase-command 'echo -n {} | $HOME/.local/bin/clipcopy && tmux paste-buffer'

# tmux-fzf-url: open URLs from pane history with fzf (prefix + u)
# (opener auto-detected: open on macOS, xdg-open on Linux)
set -g @fzf-url-history-limit '2000'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'